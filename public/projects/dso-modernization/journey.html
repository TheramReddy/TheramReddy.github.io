<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSO Modernization: the debt setoff pipeline</title>
<style>
  :root {
    --bg: #efeeea; --canvas: #efeeea; --ribbon: #d6d3ca; --card: #ffffff;
    --ink: #0a0a0a; --muted: #5c5a55; --coral: #c8432e; --violet: #0a0a0a; --blue: #0a0a0a; --line: #e4e2dc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Karla", "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; }
  .edge { fill: none; stroke: #958f82; stroke-linejoin: round; stroke-linecap: round; transition: opacity .2s, stroke .2s; }
  .edge.hot { stroke: var(--ink); }
  .edge.dim { opacity: .25; }
  .viewport { position: relative; overflow: auto; cursor: grab; padding: 0 32px 40px; scrollbar-width: thin; }
  .viewport.drag { cursor: grabbing; user-select: none; }
  .canvas { position: relative; background: var(--canvas); }
  .canvas > svg { position: absolute; inset: 0; overflow: visible; }
  .phase { position: absolute; top: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b6862; }
  .lane { position: absolute; left: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b6862; writing-mode: vertical-rl; transform: rotate(180deg); }
  .card { position: absolute; background: var(--card); border-radius: 14px; padding: 16px 18px; cursor: pointer; z-index: 2;
    box-shadow: 0 1px 2px rgba(28,27,51,.03); transition: box-shadow .2s, transform .2s; overflow: hidden; }
  .card:hover { box-shadow: 0 8px 28px rgba(28,27,51,.08); transform: translateY(-1px); }
  .card.on { box-shadow: 0 0 0 1.5px var(--ink), 0 10px 30px rgba(28,27,51,.10); }
  .card b { display: block; font-size: 13px; font-weight: 500; letter-spacing: -.005em; max-width: 85%; }
  .card .bars { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column-reverse; gap: 4px; }
  .card .bars i { display: block; width: 18px; height: 6px; border-radius: 3px; background: var(--coral); }
  .stripe { position: absolute; left: 96px; right: 0; border-radius: 16px; background: rgba(255,255,255,.55); }
  .stripe.alt { background: rgba(255,255,255,.28); }
  .panel { position: absolute; z-index: 20; left: 0; top: 0; width: 360px; background: var(--card); border-radius: 18px; padding: 24px 26px 18px;
    box-shadow: 0 24px 60px rgba(28,27,51,.16), 0 2px 6px rgba(28,27,51,.06); cursor: default; display: none; }
  .panel .anchor { position: absolute; top: 34px; width: 12px; height: 12px; background: var(--card); transform: rotate(45deg); }
  .panel .path { font-size: 11.5px; color: var(--muted); margin: 0 0 4px; }
  .panel h3 { margin: 0 0 18px; font-size: 19px; font-weight: 600; letter-spacing: -.015em; }
  .panel h4 { margin: 18px 0 6px; font-size: 14px; font-weight: 700; }
  .panel .x { position: absolute; top: 18px; right: 18px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: #f1f0ed; color: var(--muted); font-size: 16px; cursor: pointer; }
  .item { display: grid; grid-template-columns: 1fr 30px; align-items: center; gap: 4px 14px; padding: 12px 0; }
  .item + .item { border-top: 1px solid var(--line); }
  .item .name { font-size: 15px; }
  .item .fix { grid-column: 1; font-size: 12.5px; color: var(--violet); }
  .play { grid-row: 1 / span 2; grid-column: 2; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); border: 0; cursor: pointer; display: grid; place-items: center; }
  .play::before { content: ""; border-left: 8px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
  .play.open::before { border: 0; width: 8px; height: 8px; background: #fff; border-radius: 1px; margin: 0; }
  .gif { grid-column: 1 / -1; margin-top: 8px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
  .gif img { display: block; width: 100%; }
  .none { color: var(--muted); font-size: 13.5px; margin: 0; }
  /* panel additions: intent, hand-offs, rule */
  .panel .goal { margin: -10px 0 0; font-size: 14px; color: #4a4943; }
  .panel .goal i { display: block; font-style: normal; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #6b6862; margin-bottom: 3px; }
  .hand { display: grid; grid-template-columns: 52px 1fr; gap: 6px 10px; align-items: start; font-size: 12.5px; margin-top: 4px; }
  .hand > em { font-style: normal; color: #6b6862; padding-top: 4px; }
  .hand > div { display: flex; flex-wrap: wrap; gap: 6px; }
  .hand button { font: inherit; font-size: 12px; border: 1px solid #dcd9d2; background: #fff; border-radius: 99px; padding: 2px 10px; cursor: pointer; color: var(--ink); }
  .hand button:hover { border-color: var(--ink); }
  /* ---- clean pass: quieter, Apple-like ---- */
  html, body { font: 15px/1.47 "Instrument Sans", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; letter-spacing: -.011em; }
  .stripe, .stripe.alt { background: #fff; border-radius: 18px; box-shadow: none; }
  .stripe.alt { background: #faf9f6; }
  .phase, .lane { font-size: 11px; letter-spacing: .04em; text-transform: none; font-weight: 500; color: #6b6862; }
  .card { border-radius: 12px; padding: 14px 16px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04); }
  .card:hover { transform: none; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.08); }
  .card.on { box-shadow: 0 0 0 2px var(--blue), 0 8px 24px rgba(10,10,10,.12); }
  .card b { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .card .bars i { background: var(--coral); width: 14px; height: 4px; }
  .card .bars { gap: 3px; right: 14px; bottom: 14px; }
  .card .ci { display: block; width: 18px; height: 18px; margin-bottom: 8px; color: #6b6862; }
  .card.on .ci { color: var(--blue); }
  .ci svg, .ico svg, .panel h4 svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .edge { stroke: #c4c0b6; }
  .edge.hot { stroke: var(--blue); }
  .canvas > svg { z-index: 1; pointer-events: none; }
  .stripe { z-index: 0; }
  /* popover */
  .panel { width: 340px; padding: 20px 20px 16px; border-radius: 16px; background: rgba(255,255,255,.88); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
    box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.16); }
  .panel .anchor { background: rgba(255,255,255,.95); box-shadow: -1px 1px 0 rgba(0,0,0,.05); }
  .panel .x { top: 14px; right: 14px; width: 24px; height: 24px; background: rgba(0,0,0,.06); color: #6e6e73; font-size: 14px; line-height: 1; }
  .panel .x:hover { background: rgba(0,0,0,.1); }
  .ph { display: flex; gap: 12px; align-items: center; margin: 0 28px 14px 0; }
  .ico { flex: none; width: 36px; height: 36px; border-radius: 9px; background: var(--blue); color: #fff; padding: 8px; }
  .panel .path { font-size: 12px; color: var(--muted); margin: 0 0 1px; }
  .panel h3 { font-size: 17px; font-weight: 650; letter-spacing: -.02em; margin: 0; line-height: 1.2; }
  .panel .goal { margin: 0 0 4px; font-size: 14px; color: #3a3936; line-height: 1.45; }
  .panel h4 { display: flex; align-items: center; gap: 6px; margin: 16px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .panel h4 svg { width: 14px; height: 14px; flex: none; }
  .panel h4 span { width: 14px; height: 14px; display: inline-block; }
  .item { grid-template-columns: 1fr 26px; padding: 9px 0; gap: 1px 12px; }
  .item + .item { border-top: 1px solid rgba(0,0,0,.07); }
  .item .name { font-size: 14px; font-weight: 500; }
  .item .fix { font-size: 13px; color: var(--muted); }
  .play { width: 26px; height: 26px; background: var(--blue); }
  .play::before { border-left-width: 7px; border-top-width: 4.5px; border-bottom-width: 4.5px; }
  .gif { border-radius: 10px; border: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .none { font-size: 13px; }
  .hand { grid-template-columns: 56px 1fr; font-size: 13px; }
  .hand > em { color: var(--muted); padding-top: 1px; }
  .hand button { border: 0; background: none; padding: 0; color: var(--blue); font-size: 13px; text-align: left; }
  .hand button:hover { text-decoration: underline; }
  .hand > div { gap: 2px 12px; }
  .viewport { padding: 36px 32px 48px; height: 100vh; }
  /* ---- polish: brand font, browser surfaces, focus, phone layout ---- */
  @font-face { font-family: "Instrument Sans"; src: url("/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
  ::selection { background: rgba(200,67,46,.18); }
  .viewport, .panel { scrollbar-width: thin; scrollbar-color: #c4c0b6 transparent; }
  .viewport::-webkit-scrollbar { width: 8px; height: 8px; }
  .viewport::-webkit-scrollbar-thumb { background: #c4c0b6; border-radius: 8px; }
  .viewport::-webkit-scrollbar-track { background: transparent; }
  .card:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .panel button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .panel .x { display: grid; place-items: center; padding: 0; }
  .panel .x svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  @media (max-width: 600px) {
  .viewport { padding: 16px 12px 24px; }
  .panel.sheet { position: fixed; left: 8px !important; right: 8px; top: auto !important; bottom: 8px; width: auto; max-height: 70vh; overflow-y: auto; overscroll-behavior: contain; }
  .panel.sheet .anchor { display: none; }
  
  }

</style>
</head>
<body>

<div class="viewport" id="vp"><div id="outer"><div class="canvas" id="canvas"></div></div></div>

<script>
const GIF = n => `/projects/${n}.gif`;
const L = 'liheap-eap/', D = 'dso-modernization/';

/* grid */
const X0 = 150, COLW = 222, CW = 176, CH = 108, TOP = 70;
const LANES = [
  { id: 'ag',   t: 'Partner agency',   rows: 1 },
  { id: 'sys',  t: 'Interfaces and system', rows: 2 },
  { id: 'cm',   t: 'DHS case manager', rows: 3 },
  { id: 'sup',  t: 'Supervisor',       rows: 1 },
  { id: 'xer',  t: 'Xerox',            rows: 1 },
  { id: 'bank', t: 'Regions Bank',     rows: 1 },
  { id: 'tp',   t: 'Taxpayer',         rows: 1 },

const ROWH = 140, LANEGAP = 40;
let y = TOP; const laneY = {};
const laneH = l => (l.rows - 1) * ROWH + CH;
LANES.forEach(l => { laneY[l.id] = y; y += laneH(l) + LANEGAP; });
const H = y + 20, W = X0 + 12 * COLW + 60;
const PHASES = [['Intake', 0], ['Claims', 2], ['Profile and hearing', 4], ['Pay out', 6], ['Correct', 8], ['Reconcile', 10]];

/* screens */
const S = [
  { id: 'if', col: 0, lane: 'sys', t: 'Partner interfaces',
    st: [{ n: 'A partner feed fails quietly', f: 'Each interface shows feed health: Retry, Needs sign in', g: L + 'system_process_live' }],
    },
  { id: 'chk', col: 1, lane: 'sys', t: 'Receiving DOR intercept file',
    st: [{ n: 'Nobody can tell if a transfer is stuck', f: 'Six-step live checklist with logs and timing', g: L + 'system_process_live' }],
    },
  { id: 'home', col: 0, lane: 'cm', row: 0, t: 'Home',
    st: [{ n: 'Menus just to reach a profile', f: 'Ctrl K searches taxpayers and pages anywhere', g: L + 'command_palette_search' }],
    },
  { id: 'claims', col: 2, lane: 'cm', row: 0, t: 'Claims',
    st: [{ n: 'Slow repeat work in long tables', f: 'Sort, filter, resize and choose columns', g: L + 'table_sort_filter' },
         { n: 'SSNs on screen when nobody needs them', f: 'Masked, revealed by a deliberate logged click', g: L + 'ssn_reveal' }],
    },
  { id: 'manual', col: 2, lane: 'cm', row: 1, t: 'Manual claim', st: [],
    },
  { id: 'exc', col: 2, lane: 'sys', t: 'Working an exception', },
  { id: 'prof', col: 3, lane: 'cm', row: 0, t: 'Taxpayer profile',
    st: [{ n: 'Claims, hearings, payments on separate screens', f: 'One profile, four totals, seven tabs', g: L + 'tabs_switching' },
         { n: 'A long record is one long page', f: 'Claims, Intercepts, Disbursements, Refunds sub-tabs', g: D + 'trail' }],
    },
  { id: 'hsub', col: 3, lane: 'ag', t: 'Hearing submission',
    st: [{ n: 'Partner staff see menus that don’t apply', f: 'Partner staff see only Hearings', g: L + 'role_switch_nav' }],
    },
  { id: 'htab', col: 4, lane: 'cm', row: 0, t: 'Funds on hold',
    st: [{ n: 'A hold is hard to spot and explain', f: 'Header badge plus one plain sentence', g: D + 'hold' }],
    },
  { id: 'hreq', col: 4, lane: 'cm', row: 1, t: 'Review and approval', },
  { id: 'hout', col: 5, lane: 'ag', t: 'Hearing outcomes', st: [], },
  { id: 'disb', col: 5, lane: 'cm', row: 0, t: 'Agency payments by ACH', st: [],
    },
  { id: 'ref', col: 5, lane: 'cm', row: 1, t: 'Refund checks', st: [],
    },
  { id: 'agpay', col: 6, lane: 'ag', t: 'Agency is paid', st: [],
    },
  { id: 'batch', col: 6, lane: 'cm', row: 0, t: 'Check batching',
    st: [{ n: 'A batch lands on a past date', f: 'Today and earlier are locked', g: L + 'check_batch_scheduling' },
         { n: 'A batch changed on the day it runs', f: 'Run-day rule stated at the top', g: L + 'check_batch_scheduling' }],
    },
  { id: 'void', col: 7, lane: 'cm', row: 0, t: 'Void a check',
    st: [{ n: 'Unsure if the void is done or the bank told', f: 'Clear status until a supervisor approves', g: L + 'check_void_approval' }],
    },
  { id: 'appr', col: 7, lane: 'sup', t: 'Approve the void', },
  { id: 'out', col: 8, lane: 'sys', t: 'Outbound bank file',
    st: [{ n: 'Bank files are raw fixed-width text', f: 'Split into records and named fields', g: L + 'regions_file_drilldown' }],
    },
  { id: 'bank', col: 8, lane: 'bank', t: 'Bank processes the file', st: [],
    },
  { id: 'recon', col: 9, lane: 'cm', row: 0, t: 'Regions Bank files', st: [],
    },
  { id: 'rej', col: 9, lane: 'cm', row: 1, t: 'Fixing a rejected record', },
];

/* steps the documents describe but the demos don't show yet: drawn dashed */
S.push(
  { id: 'match', col: 3, lane: 'sys', t: 'Matching an intercept', },
  { id: 'xerox', col: 6, lane: 'sys', t: 'Print files to Xerox', },
  { id: 'reissue', col: 7, lane: 'cm', row: 1, t: 'Reissue a check', }
);

S.push(
  { id: 'arch', t: 'Original file archived', },
  { id: 'alert', t: 'File missing or failed', },
  { id: 'engine', t: 'Claims engine and balances', st: [],
    },
  { id: 'aging', t: 'Tracking aging', },
  { id: 'audit', t: 'Case events and activity log', st: [],
    },
  { id: 'docs', t: 'Comments and documents', st: [], },
  { id: 'tpref', t: 'Taxpayer gets the refund check', },
  { id: 'tpnote', t: 'Taxpayer gets the notice', },
  { id: 'xres', t: 'Xerox returns a result per file', },
  { id: 'xfail', t: 'Failed file resent', }
);
const POS = {
  if: [0, 'sys', 0], chk: [1, 'sys', 0], arch: [1, 'sys', 1], engine: [2, 'sys', 0], alert: [2, 'sys', 1],
  home: [0, 'cm', 0], claims: [3, 'cm', 0], manual: [3, 'cm', 1], match: [3, 'sys', 1], exc: [5, 'sys', 1], aging: [6, 'sys', 1],
  prof: [4, 'cm', 0], audit: [4, 'cm', 1], docs: [4, 'cm', 2], hsub: [4, 'ag', 0],
  htab: [5, 'cm', 0], hreq: [5, 'cm', 1], hout: [6, 'ag', 0],
  disb: [6, 'cm', 0], ref: [6, 'cm', 1], tpref: [6, 'tp', 0], agpay: [7, 'ag', 0],
  batch: [7, 'cm', 0], xerox: [7, 'xer', 0], tpnote: [7, 'tp', 0], xres: [8, 'xer', 0], xfail: [9, 'xer', 0],
  void: [8, 'cm', 0], appr: [8, 'sup', 0], reissue: [9, 'cm', 1],
  out: [10, 'sys', 0], bank: [10, 'bank', 0], recon: [11, 'cm', 0], rej: [11, 'cm', 1],
};
S.forEach(v => { const [c, l, r] = POS[v.id]; v.col = c; v.lane = l; v.row = r; });

/* what each screen is for, and the rule behind it */
const DETAIL = {
  if:     { goal: 'Know every partner connection is healthy before anyone opens a claim.', },
  chk:    { goal: 'Watch a file travel from partner to taxpayer balance without guessing.', },
  home:   { goal: 'Land on the day’s work, not on a menu.' },
  claims: { goal: 'Find the right taxpayer’s claim fast, then step into it.', },
  manual: { goal: 'Add a claim that never arrived on a file, and say where it came from.' },
  prof:   { goal: 'See one person’s whole debt story in one place: what was claimed, taken, paid and returned.', },
  hsub:   { goal: 'Let a partner agency ask for a hearing without wading through anything else.', },
  htab:   { goal: 'Make it obvious why money isn’t moving, and for how long.', },
  hout:   { goal: 'Close the loop with the agency once a decision lands.', },
  disb:   { goal: 'Show what each agency has been paid, and what is still owed.', },
  ref:    { goal: 'Follow a refund from check issued to check cleared.', },
  agpay:  { goal: 'Confirm the agency actually received its money.' },
  batch:  { goal: 'Decide when checks go out, without being able to break the schedule.' },
  void:   { goal: 'Stop a check that shouldn’t be cashed, and be certain it’s stopped.', },
  appr:   { goal: 'Give a supervisor one clear decision: approve or reject the void.', },
  reissue:{ },
  out:    { goal: 'Prove exactly what the bank was sent, record by record.' },
  bank:   { goal: 'Know whether the bank accepted, acknowledged or rejected the file.' },
  recon:  { goal: 'Check the bank’s answer against what DSO sent, and close the loop.', },
};
Object.assign(DETAIL, {
  engine: { goal: 'Turn a validated file into allocations and updated taxpayer balances.', },
  audit:  { goal: 'Answer who did what, and when, without leaving the profile.', },
  docs:   { goal: 'Keep the paperwork and the conversation next to the debt it concerns.', },
  tpref:  { goal: 'Get a refund check that is the right amount, once.', },
  tpnote: { goal: 'Understand what happened to their refund and what they can do about it.' },
});
S.forEach(s => Object.assign(s, DETAIL[s.id]));

/* best-knowledge content for screens the demos don't show yet; worked out from the business rules */
const FILL = {
  exc:     { goal: 'Clear an item the system couldn’t settle on its own.', },
  hreq:    { goal: 'Decide a hearing request with the reason and documents in front of you.', },
  rej:     { goal: 'Fix a record the bank turned away and get it back out.', },
  match:   { goal: 'Pair every intercept with the right taxpayer and claim.', },
  xerox:   { goal: 'Send each notice and check to print, and know it left.', },
  reissue: { goal: 'Replace a voided check without losing the trail.', },
  arch:    { goal: 'Keep the file exactly as it arrived.', },
  alert:   { goal: 'Hear about a bad or missing file before a taxpayer does.', },
  aging:   { goal: 'See which open items are getting old.', },
  tpref:   { goal: 'Get a refund check that is the right amount, once.', },
  tpnote:  { goal: 'Understand what happened to the refund and what to do about it.', },
  xres:    { goal: 'Hear back about every file that was sent.', },
  xfail:   { goal: 'Get a failed file out the door again.', },
};
S.forEach(v => { if (FILL[v.id]) { Object.assign(v, FILL[v.id]); v.st = v.st || []; } });

/* ribbons: [from, to, thickness]; 'L' enters from the left edge, 'R' leaves to the right edge */
const R = [
  ['L', 'if', 64], ['L', 'home', 36], ['if', 'chk', 64], ['chk', 'arch', 14], ['chk', 'alert', 14], ['chk', 'engine', 58],
  ['engine', 'claims', 58], ['home', 'claims', 30], ['manual', 'claims', 18],
  ['claims', 'match', 16], ['match', 'exc', 14], ['exc', 'aging', 10], ['match', 'prof', 16], ['claims', 'prof', 72], ['hsub', 'prof', 24],
  ['prof', 'audit', 14], ['audit', 'docs', 10],
  ['prof', 'htab', 24], ['htab', 'hreq', 16], ['hreq', 'hout', 16], ['hout', 'disb', 14], ['prof', 'disb', 40], ['prof', 'ref', 24],
  ['disb', 'agpay', 36], ['ref', 'tpref', 12], ['ref', 'batch', 22], ['ref', 'void', 12],
  ['batch', 'xerox', 12], ['xerox', 'tpnote', 12], ['xerox', 'xres', 12], ['xres', 'xfail', 10],
  ['batch', 'out', 22], ['void', 'appr', 12], ['void', 'reissue', 10], ['appr', 'out', 12],
  ['out', 'bank', 32], ['bank', 'recon', 32], ['recon', 'rej', 8], ['recon', 'R', 30], ['agpay', 'R', 34],
];

const IC = {
  plug: '<path d="M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0V8zM12 16v5"/>',
  download: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>', upload: '<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  home: '<path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"/>', list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  alert: '<path d="M12 4l9 16H3zM12 10v4M12 17h.01"/>', clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  person: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', doc: '<path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/>',
  send: '<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>', lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  check: '<circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>', flag: '<path d="M5 21V4M5 5h12l-2 4 2 4H5"/>',
  dollar: '<circle cx="12" cy="12" r="8"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5V8M12 16v1.5"/>',
  calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>', x: '<circle cx="12" cy="12" r="8"/><path d="M9 9l6 6M15 9l-6 6"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/>',
  printer: '<path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M7 14h10v6H7z"/>',
  inbox: '<path d="M4 13l3-8h10l3 8v6H4zM4 13h5l1 2h4l1-2h5"/>', mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  bank: '<path d="M3 9l9-5 9 5M5 9v9M9 9v9M15 9v9M19 9v9M3 20h18"/>', archive: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>',
  bell: '<path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/>', target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>', arrows: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  info: '<circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8h.01"/>',
};
const svgI = k => `<svg viewBox="0 0 24 24">${IC[k] || IC.doc}</svg>`;
const SCR_IC = { if: 'plug', chk: 'download', engine: 'gear', home: 'home', claims: 'list', manual: 'plus', match: 'link', exc: 'alert', aging: 'clock',
  prof: 'person', audit: 'clock', docs: 'doc', hsub: 'send', htab: 'lock', hreq: 'check', hout: 'flag', disb: 'dollar', ref: 'dollar', agpay: 'dollar',
  batch: 'calendar', void: 'x', appr: 'check', reissue: 'refresh', xerox: 'printer', xres: 'inbox', xfail: 'refresh', tpnote: 'mail', tpref: 'mail',
  out: 'upload', bank: 'bank', recon: 'check', rej: 'alert', arch: 'archive', alert: 'bell' };

/* build */
const canvas = document.getElementById('canvas');
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
const NS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('width', W); svg.setAttribute('height', H);
canvas.append(svg);
const ribbons = document.createElementNS(NS, 'g');
svg.append(ribbons);
const el = (cls, html, css, parent = canvas) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; Object.assign(d.style, css); parent.append(d); return d; };

PHASES.forEach(([t, col]) => el('phase', t, { left: X0 + col * COLW + 'px', top: '30px' }));
LANES.forEach((l, i) => {
  el('stripe' + (i % 2 ? ' alt' : ''), '', { top: laneY[l.id] - 14 + 'px', height: laneH(l) + 28 + 'px' });
  el('lane', l.t, { top: laneY[l.id] + 'px', height: laneH(l) + 'px', left: '44px', textAlign: 'center', lineHeight: '1' });
});

const box = {};
S.forEach(s => {
  const x = X0 + s.col * COLW, yy = laneY[s.lane] + (s.row || 0) * ROWH;
  box[s.id] = { x, y: yy, w: CW, h: CH };
  const n = (s.st || []).length;
  const c = el('card',
    `<span class="ci">${svgI(SCR_IC[s.id])}</span><b>${s.t}</b>${n ? `<span class="bars">${'<i></i>'.repeat(n)}</span>` : ''}`,
    { left: x + 'px', top: yy + 'px', width: CW + 'px', height: CH + 'px' });
  c.id = 'c-' + s.id; c.onclick = e => { e.stopPropagation(); select(s.id); };
  c.tabIndex = 0; c.setAttribute('role', 'button'); c.setAttribute('aria-label', s.t);
  c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(s.id); } };
});

/* connectors: elbow lines routed through the gaps between cards, with arrowheads */
const defs = document.createElementNS(NS, 'defs');
defs.innerHTML = '<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="context-stroke"/></marker>';
svg.prepend(defs);
function rounded(pts, r) {
  const q = pts.filter((p, i) => !i || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1]);
  let d = 'M' + q[0].join(',');
  for (let i = 1; i < q.length - 1; i++) {
    const a = q[i - 1], c = q[i], b = q[i + 1];
    const l1 = Math.hypot(a[0] - c[0], a[1] - c[1]), l2 = Math.hypot(b[0] - c[0], b[1] - c[1]);
    const r1 = Math.min(r, l1 / 2), r2 = Math.min(r, l2 / 2);
    d += `L${c[0] + (a[0] - c[0]) / l1 * r1},${c[1] + (a[1] - c[1]) / l1 * r1}Q${c[0]},${c[1]} ${c[0] + (b[0] - c[0]) / l2 * r2},${c[1] + (b[1] - c[1]) / l2 * r2}`;
  }
  return d + 'L' + q[q.length - 1].join(',');
}
const edges = [];
R.forEach(([a, b, t], idx) => {
  const A = box[a], B = box[b]; let pts;
  if (a === 'L') { const m = B.y + CH / 2; pts = [[0, m], [B.x - 4, m]]; }
  else if (b === 'R') { const m = A.y + CH / 2; pts = [[A.x + CW, m], [W - 14, m]]; }
  else if (A.x === B.x) { const dn = B.y > A.y, cx = A.x + CW / 2; pts = [[cx, dn ? A.y + CH : A.y], [cx, dn ? B.y - 4 : B.y + CH + 4]]; }
  else if (A.y === B.y && B.x - A.x <= COLW + 1) { const m = A.y + CH / 2; pts = [[A.x + CW, m], [B.x - 4, m]]; }
  else {
    const dn = B.y > A.y, off = (idx % 4) * 5, k = (idx % 3) * 4;
    const ty = dn ? A.y + CH + 14 + off : A.y - 14 - off;
    const am = A.y + CH / 2, bm = B.y + CH / 2, x1 = A.x + CW + 12 + k, x2 = B.x - 12 - k;
    pts = [[A.x + CW, am], [x1, am], [x1, ty], [x2, ty], [x2, bm], [B.x - 4, bm]];
  }
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', rounded(pts, 10)); path.setAttribute('class', 'edge');
  path.setAttribute('stroke-width', (1.4 + t / 22).toFixed(1)); path.setAttribute('marker-end', 'url(#arr)');
  ribbons.append(path); edges.push({ a, b, el: path });
});
function lit(id) { edges.forEach(e => { const on = id && (e.a === id || e.b === id); e.el.classList.toggle('hot', !!on); e.el.classList.toggle('dim', !!id && !on); }); }

/* panel */
const panel = el('panel', '', {}); panel.onclick = e => e.stopPropagation();
let current;
const title = id => S.find(v => v.id === id).t;
function hand(id) {
  const from = R.filter(r => r[1] === id && r[0] !== 'L').map(r => r[0]);
  const to = R.filter(r => r[0] === id && r[1] !== 'R').map(r => r[1]);
  const row = (lbl, ids) => ids.length ? `<em>${lbl}</em><div>${ids.map(i => `<button data-id="${i}">${title(i)}</button>`).join('')}</div>` : '';
  const h = row('From', from) + row('Leads to', to);
  return h ? `<h4>${svgI('arrows')}Hand-offs</h4><div class="hand">${h}</div>` : '';
}
function select(id) {
  const s = S.find(v => v.id === id); current = id; lit(id);
  document.querySelectorAll('.card.on').forEach(c => c.classList.remove('on'));
  document.getElementById('c-' + id).classList.add('on');
  const items = (s.st || []).map((v, i) => `<div class="item"><span class="name">${v.n}</span><button class="play" data-i="${i}" aria-label="Play the demo"></button><span class="fix">${v.f}</span></div>`).join('');
  const phase = PHASES.filter(p => p[1] <= s.col).pop()[0];
  panel.innerHTML = `<i class="anchor"></i><button class="x" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
    <div class="ph"><span class="ico">${svgI(SCR_IC[id])}</span><div><p class="path">${phase}</p><h3>${s.t}</h3></div></div>
    ${s.goal ? `<h4>${svgI('target')}Intent</h4><p class="goal">${s.goal}</p>` : ''}
    ${items ? `<h4>${svgI('alert')}Problem and response</h4>${items}` : `<h4>${svgI('check')}Friction</h4><p class="none">Nothing flagged on this screen.</p>`}
    ${hand(id)}`;
  panel.querySelector('.x').onclick = close;
  panel.querySelectorAll('.hand button').forEach(b => b.onclick = () => select(b.dataset.id));
  panel.querySelectorAll('.play').forEach(b => b.onclick = () => {
    const item = b.parentElement, open = item.querySelector('.gif');
    panel.querySelectorAll('.gif').forEach(g => g.remove()); panel.querySelectorAll('.play').forEach(p => p.classList.remove('open'));
    if (!open) { b.classList.add('open'); el('gif', `<img src="${GIF(s.st[b.dataset.i].g)}" alt="Demo: ${s.st[b.dataset.i].f}">`, {}, item); }
    requestAnimationFrame(place);
  });
  const narrow = matchMedia('(max-width: 600px)').matches;   // phones: the panel becomes a bottom sheet
  panel.classList.toggle('sheet', narrow); (narrow ? document.body : canvas).append(panel);
  panel.style.display = 'block';
  place();
  const bx = box[id], c = document.getElementById('vp'), k = 1;
  c.scrollTo({ left: Math.max(0, (bx.x - c.clientWidth * .22 / k) * k), top: Math.max(0, (bx.y - 60) * k), behavior: 'smooth' });
}
function place() {
  if (!current || panel.classList.contains('sheet')) return;
  const B = box[current], pw = panel.offsetWidth, ph = panel.offsetHeight, gap = 18;
  const right = B.x + CW + gap + pw <= W;
  const px = right ? B.x + CW + gap : B.x - gap - pw;
  const py = Math.max(0, Math.min(B.y - 6, H - ph - 10));
  panel.style.left = px + 'px'; panel.style.top = py + 'px';
  const a = panel.querySelector('.anchor');
  if (a) { a.style.left = right ? '-6px' : ''; a.style.right = right ? '' : '-6px'; a.style.top = Math.max(18, Math.min(ph - 30, B.y + CH / 2 - py - 6)) + 'px'; }
}
function close() { const was = current && document.getElementById('c-' + current); if (was && panel.contains(document.activeElement)) was.focus(); current = null; lit(null); panel.style.display = 'none'; document.querySelectorAll('.card.on').forEach(c => c.classList.remove('on')); }
canvas.addEventListener('click', close);
addEventListener('keydown', e => { if (e.key === 'Escape' && current) close(); });

/* view: actual size with drag-to-pan, or fit */
const vp = document.getElementById('vp'), outer = document.getElementById('outer');
outer.style.width = W + 'px'; outer.style.height = H + 'px';
let drag = null;
vp.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.target.closest('.panel')) return;   // touch keeps native scrolling
 drag = { x: e.clientX, y: e.clientY, l: vp.scrollLeft, t: vp.scrollTop, moved: false }; });
addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; vp.classList.add('drag'); } vp.scrollLeft = drag.l - dx; vp.scrollTop = drag.t - dy; });
addEventListener('pointerup', () => { if (drag && drag.moved) addEventListener('click', e => e.stopPropagation(), { capture: true, once: true }); drag = null; vp.classList.remove('drag'); });

</script>
</body>
</html>
