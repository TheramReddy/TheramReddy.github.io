<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <!-- the theme is set before the first paint: light, unless the visitor chose dark on an earlier visit -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#0c0c0b'
        }
      } catch (e) {}
    </script>
    <meta name="description" content="UX and Product Designer who makes old systems easy to use, builds design systems, and designs AI you can see and steer." />
    <title>dasavanth</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
